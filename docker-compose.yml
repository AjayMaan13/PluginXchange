services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: pluginxchange
      DB_USER: pluginxchange
      DB_PASS: pluginxchange
    # Install dependencies on first start, then run php-fpm
    command: sh -c "[ -d vendor ] || composer install --no-interaction; exec php-fpm"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pluginxchange
      MYSQL_USER: pluginxchange
      MYSQL_PASSWORD: pluginxchange
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Files here run once, in name order, on first start of an empty volume
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
