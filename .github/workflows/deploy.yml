name: Release

# Push a tag like v0.1.0 (or run the workflow by hand) to build the production image, publish it to GitHub Container
# Registry, smoke-test it, and only then move `latest` to it.
#
# On a tag push, once the AWS repository variables are set (see docs/deploy-aws.md), the same image is also pushed to ECR
# and, after approval on the `production` environment, deployed to the EC2 instance and smoke-tested at its public URL.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # lets the job ask AWS for short-lived credentials (OIDC)
    outputs:
      image-ref: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase, and github.repository keeps its capitals
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only on release tags, and only once the AWS variables exist: also push to ECR (the instance pulls from there)
      - name: AWS credentials (push role)
        id: aws
        if: ${{ vars.AWS_PUSH_ROLE_ARN != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: ${{ steps.aws.outcome == 'success' }}
        uses: aws-actions/amazon-ecr-login@v2

      # A tag push gets the version tag (v0.1.0) and the commit tag (sha-abc1234). A manual run gets only the commit tag.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.name.outputs.image }}
            ${{ steps.ecr.outcome == 'success' && vars.ECR_REPOSITORY_URL || '' }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs the image that was just pushed (by digest) against a real MySQL, then drives it with the .NET tools
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pluginxchange
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load schema and sample data
        run: |
          mysql -h127.0.0.1 -uroot -proot pluginxchange < database/schema.sql
          mysql -h127.0.0.1 -uroot -proot pluginxchange < database/seed.sql

      - name: Start the release image
        run: |
          docker pull "$IMAGE"
          docker run -d --name api --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_NAME=pluginxchange -e DB_USER=root -e DB_PASS=root \
            -e ADMIN_API_KEY=smoke-admin-key "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Image checks (runs as non-root, no dev files)
        run: |
          if [ "$(docker exec api id -u)" = "0" ]; then echo "container runs as root"; exit 1; fi
          for dev_path in /var/www/html/tests /var/www/html/vendor/phpunit; do
            if docker exec api test -e "$dev_path"; then echo "dev path in image: $dev_path"; exit 1; fi
          done
          echo "ok: non-root, no dev files"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Smoke test
        run: dotnet run --project tools/PluginXchange.Cli -- smoke --base-url http://127.0.0.1:8080

      # The release image uses Apache with many workers, so this exercises more parallelism than CI does
      - name: Load test
        run: |
          dotnet run --project tools/PluginXchange.Cli -- loadtest --base-url http://127.0.0.1:8080 \
            --admin-key smoke-admin-key --orders 50 --qty 3 --runs 3

      - if: failure()
        run: docker logs api

  # `latest` only ever points at an image that passed the smoke test
  promote-latest:
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag as latest
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image-ref }}"
          docker buildx imagetools create -t "${IMAGE%@*}:latest" "$IMAGE"

  # Deploys the image that passed the smoke test to the EC2 instance. Waits for approval when the `production` environment
  # has required reviewers. Skipped until the AWS repository variables are set.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-test]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      # The digest, so the instance runs exactly the bytes the smoke test ran
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}@${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ship the deploy files to S3
        run: |
          aws s3 cp deploy/docker-compose.prod.yml "s3://$DEPLOY_BUCKET/deploy/docker-compose.prod.yml" --only-show-errors
          aws s3 cp deploy/Caddyfile "s3://$DEPLOY_BUCKET/deploy/Caddyfile" --only-show-errors
          aws s3 cp deploy/backup.sh "s3://$DEPLOY_BUCKET/deploy/backup.sh" --only-show-errors
          aws s3 cp deploy/deploy.sh "s3://$DEPLOY_BUCKET/deploy/deploy.sh" --only-show-errors
          aws s3 cp database/schema.sql "s3://$DEPLOY_BUCKET/deploy/schema.sql" --only-show-errors

      # Runs deploy/deploy.sh on the instance through SSM (no SSH). The script rolls back by itself when the new
      # version does not become healthy, and then exits non-zero, which fails this step.
      - name: Deploy on the instance
        run: |
          cmd="aws s3 cp s3://$DEPLOY_BUCKET/deploy/deploy.sh /tmp/deploy.sh --region $AWS_REGION --only-show-errors"
          cmd="$cmd && IMAGE=$IMAGE BUCKET=$DEPLOY_BUCKET AWS_REGION=$AWS_REGION bash /tmp/deploy.sh"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_REF_NAME" \
            --timeout-seconds 900 \
            --parameters "$(jq -cn --arg c "$cmd" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # The waiter fails on a failed command, so ignore its result and read the real status
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "deploy status: $status"
          [ "$status" = "Success" ]

      - name: Health check at the public URL
        run: curl -fsS --retry 10 --retry-delay 3 --retry-connrefused "$PUBLIC_URL/health"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The production database starts empty, so --provision creates a reseller and a product to place one order with
      - name: Smoke test the public URL
        run: |
          admin_key=$(aws ssm get-parameter --name /pluginxchange/admin_api_key --with-decryption \
            --query Parameter.Value --output text)
          echo "::add-mask::$admin_key"
          PXC_ADMIN_KEY="$admin_key" dotnet run --project tools/PluginXchange.Cli -- smoke \
            --base-url "$PUBLIC_URL" --provision yes

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo
            echo "- image: \`$IMAGE\`"
            echo "- url: $PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"
