name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pluginxchange_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse
      - name: Load schema
        run: |
          if [ -f database/schema.sql ]; then
            mysql -h127.0.0.1 -uroot -proot pluginxchange_test < database/schema.sql
          fi
      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: pluginxchange_test
          DB_USER: root
          DB_PASS: root
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # The .NET job is added in Phase 6, when tools/PluginXchange.sln exists.

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t pluginxchange:ci .
