name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pluginxchange_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse
      - name: Load schema
        run: |
          if [ -f database/schema.sql ]; then
            mysql -h127.0.0.1 -uroot -proot pluginxchange_test < database/schema.sql
          fi
      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: pluginxchange_test
          DB_USER: root
          DB_PASS: root
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      - name: Integrity checks
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: pluginxchange_test
          DB_USER: root
          DB_PASS: root
        run: php bin/integrity.php
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tools/PluginXchange.sln

  # Starts the API on PHP's built-in server (10 workers) and runs the .NET load test against it
  loadtest:
    runs-on: ubuntu-latest
    needs: [test, dotnet]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pluginxchange_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: pluginxchange_test
      DB_USER: root
      DB_PASS: root
      ADMIN_API_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: composer install --no-interaction --prefer-dist
      - run: mysql -h127.0.0.1 -uroot -proot pluginxchange_test < database/schema.sql
      - name: Start the API
        run: |
          PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8080 -t public public/index.php > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - name: Create a reseller and run the load test
        run: |
          KEY=$(curl -sf -X POST -H "X-API-Key: $ADMIN_API_KEY" -d '{"name":"CI","country":"CA"}' \
            http://127.0.0.1:8080/api/v1/resellers | jq -r .data.api_key)
          dotnet run --project tools/PluginXchange.Cli -- loadtest --base-url http://127.0.0.1:8080 \
            --api-key "$KEY" --admin-key "$ADMIN_API_KEY" --orders 50 --qty 3 --runs 5
      - name: Integrity checks
        run: php bin/integrity.php
      - if: failure()
        run: cat server.log

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t pluginxchange:ci .
