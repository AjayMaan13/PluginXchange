# Production web server config: one virtual host on 8080 that sends every request to public/index.php.
ServerName localhost
ServerTokens Prod
ServerSignature Off
# Same limit as nginx in the dev stack (the app answers with a JSON 413 above 2,000,000 bytes)
LimitRequestBody 2097152

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
